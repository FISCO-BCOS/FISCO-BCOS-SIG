server:
  port: 8081

spring:
  application:
    name: points-backend
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.124.128:3306/points_dapp?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.points.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: points-exchange-dapp-secret-key-2026
  expiration: 86400000

bcos:
  node-ip: 192.168.124.128
  node-port: 20200
  group-id: 1
  cert-path: classpath:cert/
  webase-url: http://192.168.124.128:5002/WeBASE-Front/trans/handle
  owner-address: '0x11d81144bb4e78dce997e0f1746e1cb6fe092b9f'
  contract-address:
    points: '0x4382c0fb361325a206fa7f6b87262a924b1200b3'

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.points: debug
  file:
    name: logs/points-backend.log